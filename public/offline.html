<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · IAG Finance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        opacity: 0.75;
        font-size: 0.9rem;
        max-width: 28rem;
      }
      button {
        background: #f97316;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You’re offline</h1>
      <p>Reconnect to load IAG Finance. This page has no app scripts, so it cannot cause a stale-chunk crash.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
